<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LangkahKu — Penghitung Langkah Harian Presisi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --subtle: #94a3b8;
      --orange: #ea580c;
      --orange-dark: #c2410c;
      --orange-soft: #fff7ed;
      --green: #059669;
      --green-soft: #ecfdf5;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --rose: #be123c;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input { font-family: inherit; }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--orange);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-title { font-size: 15px; font-weight: 800; line-height: 1.2; color: var(--text); }
    .brand-date { font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }

    .target-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      background: #f1f5f9;
      transition: background 0.15s;
    }
    .target-btn:hover { background: #e2e8f0; }

    /* Main Layout */
    .main {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* Status Row */
    .status-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill-active { background: var(--green-soft); color: var(--green); }
    .pill-active .pill-dot { background: #10b981; animation: pulse 1.4s ease-in-out infinite; }
    .pill-available { background: var(--blue-soft); color: var(--blue); }
    .pill-available .pill-dot { background: #3b82f6; }
    .pill-unavailable { background: var(--amber-soft); color: var(--amber); }
    .pill-unavailable .pill-dot { background: #f59e0b; }
    .pill-denied { background: var(--rose-soft); color: var(--rose); }
    .pill-denied .pill-dot { background: #f43f5e; }
    .pill-neutral { background: #f1f5f9; color: #475569; }
    .pill-neutral .pill-dot { background: #94a3b8; }

    .rhythm-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      white-space: nowrap;
    }
    .rhythm-badge.locked { background: var(--green-soft); color: var(--green); border-color: #a7f3d0; }
    .rhythm-badge.verifying { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
    .rhythm-badge.error { background: var(--rose-soft); color: var(--rose); border-color: var(--rose-border); }

    /* Circular Ring */
    .ring-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 14px;
      width: 224px;
      height: 224px;
    }
    .ring-svg { width: 100%; height: 100%; }
    .ring-progress {
      transition: stroke-dashoffset 0.3s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .step-number {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text);
    }
    .step-goal { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 6px; }
    .step-goal strong { color: #334155; }
    .step-pct {
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--orange-soft);
      color: var(--orange-dark);
    }

    /* Controls */
    .controls-row {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-primary {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      background: var(--orange);
      color: #fff;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--orange-dark); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary.paused-mode {
      background: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }
    .btn-primary.paused-mode:hover { background: #1e293b; }

    .btn-reset {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: #e2e8f0; }

    /* Signal Diagnostics */
    .signal-box {
      width: 100%;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .signal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .signal-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #334155; flex-shrink: 0; }
    .signal-track {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .signal-fill {
      height: 100%;
      background: #f97316;
      border-radius: 999px;
      width: 0%;
      transition: width 0.08s linear;
    }
    .signal-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #0f172a;
      left: 31%;
    }
    .signal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--subtle);
    }
    .signal-foot span:last-child { flex-shrink: 0; }

    /* Diagnostic Banner */
    .diag-box {
      width: 100%;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--amber-border);
      background: var(--amber-soft);
      color: #78350f;
      font-size: 12px;
      line-height: 1.5;
    }
    .diag-box.error {
      border-color: var(--rose-border);
      background: var(--rose-soft);
      color: #881337;
    }
    .diag-title { font-weight: 700; margin-bottom: 4px; }
    .hidden { display: none !important; }

    /* Sensitivity Card */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .section-mono { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .sens-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
    }
    .sens-btn {
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      transition: all 0.15s;
    }
    .sens-btn.active {
      background: #0f172a;
      color: #fff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
    }

    /* History Card */
    .history-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .history-total { font-size: 12px; font-weight: 600; color: var(--muted); }
    .history-list { display: flex; flex-direction: column; gap: 11px; margin-top: 12px; }
    .hist-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .hist-day { font-weight: 500; color: #475569; }
    .hist-day.today { font-weight: 700; color: var(--text); }
    .hist-val { font-weight: 600; color: #334155; }
    .hist-val.today { font-weight: 700; color: var(--orange-dark); }
    .hist-val span { font-weight: 400; color: var(--subtle); }
    .hist-track { width: 100%; height: 7px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .hist-bar { height: 100%; background: #94a3b8; border-radius: 999px; transition: width 0.3s ease; }
    .hist-bar.today { background: var(--orange); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 340px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .modal-close { padding: 4px; color: var(--subtle); border-radius: 8px; }
    .modal-close:hover { color: var(--text); background: #f1f5f9; }
    .field-label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .field-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      outline: none;
    }
    .field-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn-cancel {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: #f1f5f9;
      color: #475569;
    }
    .btn-save {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: var(--orange);
      color: #fff;
    }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 300px;
      width: calc(100% - 32px);
      pointer-events: none;
    }
    .toast-item {
      background: #0f172a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
      transition: opacity 0.25s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>

  <div id="toastContainer" class="toast-wrap"></div>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
            <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">LangkahKu</h1>
          <p id="todayDateLabel" class="brand-date">Hari ini</p>
        </div>
      </div>

      <button id="editGoalBtn" type="button" class="target-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
        </svg>
        <span>Target</span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="card" style="display:flex;flex-direction:column;align-items:center;">
      <div class="status-row">
        <span id="sensorStatusPill" class="pill pill-neutral">
          <span class="pill-dot"></span>
          <span id="sensorStatusText">Memeriksa sensor...</span>
        </span>
        <span id="rhythmLockBadge" class="rhythm-badge">Memeriksa</span>
      </div>

      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="94" stroke="#f1f5f9" stroke-width="14" fill="none" />
          <circle id="progressCircle" class="ring-progress" cx="110" cy="110" r="94" stroke="#ea580c" stroke-width="14" stroke-linecap="round" fill="none" stroke-dasharray="590.62" stroke-dashoffset="590.62" />
        </svg>
        <div class="ring-center">
          <span id="stepCountText" class="step-number">0</span>
          <span class="step-goal">dari <strong id="goalCountText">8.000</strong> langkah</span>
          <span id="goalPercentText" class="step-pct">0%</span>
        </div>
      </div>

      <div class="controls-row">
        <button id="toggleTrackingBtn" type="button" class="btn-primary">
          <span id="toggleTrackingIcon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          </span>
          <span id="toggleTrackingLabel">Mulai Hitung</span>
        </button>
        <button id="resetTodayBtn" type="button" title="Reset langkah hari ini" aria-label="Reset langkah hari ini" class="btn-reset">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>

      <div class="signal-box">
        <div class="signal-head">
          <span id="sensorSourceLabel">Sumber Sensor: Mendeteksi...</span>
          <span id="signalReadout" class="signal-val">0.00 m/s²</span>
        </div>
        <div class="signal-track">
          <div id="signalBar" class="signal-fill"></div>
          <div id="thresholdMarker" class="signal-marker" title="Ambang batas langkah"></div>
        </div>
        <div class="signal-foot">
          <span id="sensorModeInfo">Filter gravitasi + ritme 3 langkah</span>
          <span id="rejectedCountText">Guncangan diabaikan: 0</span>
        </div>
      </div>

      <div id="sensorDiagnosticBox" class="diag-box hidden">
        <p id="sensorDiagnosticTitle" class="diag-title"></p>
        <p id="sensorDiagnosticDetail"></p>
      </div>
    </section>

    <section class="card" style="padding:16px 18px;">
      <div class="section-head">
        <h2 class="section-label">Kalibrasi Posisi HP</h2>
        <span id="sensThresholdText" class="section-mono">Threshold 1.25 m/s²</span>
      </div>
      <div class="sens-grid">
        <button type="button" data-sens="low" class="sens-btn">Saku (Ketat)</button>
        <button type="button" data-sens="medium" class="sens-btn active">Normal</button>
        <button type="button" data-sens="high" class="sens-btn">Tangan (Peka)</button>
      </div>
    </section>

    <section class="card">
      <div class="section-head" style="margin-bottom:0;">
        <h2 class="history-title">Riwayat 7 Hari Terakhir</h2>
        <span id="weeklyTotalText" class="history-total">Total: 0</span>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <div id="goalModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 class="modal-title">Target Langkah Harian</h3>
        <button id="closeGoalModalBtn" type="button" class="modal-close" aria-label="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="goalForm">
        <label for="goalInput" class="field-label">Jumlah langkah per hari</label>
        <input id="goalInput" type="number" min="500" max="50000" step="500" required class="field-input" />
        <div class="modal-actions">
          <button id="cancelGoalBtn" type="button" class="btn-cancel">Batal</button>
          <button type="submit" class="btn-save">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'langkahku_precision_v4';
      const RING_CIRCUMFERENCE = 2 * Math.PI * 94;

      const SENSITIVITY = {
        low:    { peak: 1.65, valley: 0.55, label: 'Threshold 1.65 m/s²' },
        medium: { peak: 1.25, valley: 0.45, label: 'Threshold 1.25 m/s²' },
        high:   { peak: 0.95, valley: 0.35, label: 'Threshold 0.95 m/s²' }
      };

      const MIN_STEP_INTERVAL_MS = 260;
      const MAX_STEP_INTERVAL_MS = 1300;
      const RHYTHM_RESET_MS = 1650;
      const CONFIRM_STEPS_NEEDED = 3;

      const STATUS = {
        AVAILABLE: 'AVAILABLE',
        ACTIVE: 'ACTIVE',
        UNAVAILABLE: 'UNAVAILABLE',
        DENIED: 'DENIED'
      };

      const PLAY_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
      const PAUSE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

      function getTodayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function formatDateHeading() {
        try {
          return new Date().toLocaleDateString('id-ID', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
          });
        } catch (e) {
          return getTodayKey();
        }
      }

      function loadState() {
        const fallback = { dailyGoal: 8000, sensitivity: 'medium', history: {} };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              dailyGoal: parsed.dailyGoal || 8000,
              sensitivity: SENSITIVITY[parsed.sensitivity] ? parsed.sensitivity : 'medium',
              history: parsed.history && typeof parsed.history === 'object' ? parsed.history : {}
            };
          }
        } catch (e) {}
        return fallback;
      }

      let state = loadState();
      if (typeof state.history[getTodayKey()] !== 'number') {
        state.history[getTodayKey()] = 0;
      }

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }

      const hasNativeBridge = typeof window.AndroidStepBridge !== 'undefined' && window.AndroidStepBridge !== null;
      let sensorStatus = STATUS.AVAILABLE;
      let sensorTypeLabel = 'Mendeteksi...';
      let isTracking = false;
      let hardwareSignalSeen = false;
      let sensorWatchdog = null;
      let idleCheckInterval = null;
      let genericAccelSensor = null;

      let gravity = { x: 0, y: 0, z: 0, initialized: false };
      let magWindow = [];
      let isPeakArmed = false;
      let lastCandidateTime = 0;
      let pendingRhythmSteps = 0;
      let isWalkingLocked = false;
      let rejectedJolts = 0;

      function isEmbeddedIframe() {
        try { return window.self !== window.top; } catch (e) { return true; }
      }

      function isInsecureOrigin() {
        const proto = window.location.protocol;
        if (proto === 'file:' || proto === 'content:') return true;
        if (typeof window.isSecureContext === 'boolean' && !window.isSecureContext) return true;
        return false;
      }

      function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'toast-item';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 260);
        }, 2600);
      }

      function formatInt(n) {
        return Math.round(n).toLocaleString('id-ID');
      }

      function getTodaySteps() {
        const key = getTodayKey();
        if (typeof state.history[key] !== 'number') state.history[key] = 0;
        return state.history[key];
      }

      function setTodaySteps(value) {
        state.history[getTodayKey()] = Math.max(0, Math.floor(value));
        saveState();
        renderUI();
      }

      function addSteps(count) {
        setTodaySteps(getTodaySteps() + count);
      }

      function showDiagnostic(level, title, detail) {
        const box = document.getElementById('sensorDiagnosticBox');
        const tEl = document.getElementById('sensorDiagnosticTitle');
        const dEl = document.getElementById('sensorDiagnosticDetail');
        if (!title) {
          box.classList.add('hidden');
          return;
        }
        box.classList.remove('hidden');
        box.className = level === 'error' ? 'diag-box error' : 'diag-box';
        tEl.textContent = title;
        dEl.textContent = detail;
      }

      function setSensorStatus(nextStatus, detailTitle, detailMsg) {
        sensorStatus = nextStatus;
        const pill = document.getElementById('sensorStatusPill');
        const txt = document.getElementById('sensorStatusText');

        if (nextStatus === STATUS.ACTIVE) {
          pill.className = 'pill pill-active';
          txt.textContent = 'Sensor aktif';
          showDiagnostic(null, '', '');
        } else if (nextStatus === STATUS.AVAILABLE) {
          pill.className = 'pill pill-available';
          txt.textContent = 'Sensor tersedia';
          showDiagnostic(null, '', '');
        } else if (nextStatus === STATUS.DENIED) {
          pill.className = 'pill pill-denied';
          txt.textContent = 'Izin ditolak';
          showDiagnostic('error', detailTitle || 'Izin sensor aktivitas ditolak', detailMsg || 'Buka Pengaturan Aplikasi > LangkahKu > Izin > Aktivitas Fisik lalu pilih Izinkan.');
        } else {
          pill.className = 'pill pill-unavailable';
          txt.textContent = 'Sensor tidak tersedia';
          showDiagnostic('warn', detailTitle || 'Sensor gerak tidak tersedia', detailMsg || 'Install APK Android LangkahKu atau buka lewat tautan HTTPS langsung (bukan embed iframe).');
        }

        document.getElementById('sensorSourceLabel').textContent = `Sumber: ${sensorTypeLabel}`;
        updateTrackingButtonUI();
        updateRhythmBadge();
      }

      function initSensorEnvironment() {
        if (hasNativeBridge) {
          try {
            const info = JSON.parse(window.AndroidStepBridge.getSensorInfo());
            sensorTypeLabel = info.type && info.type !== 'NONE' ? `Native (${info.type})` : 'Tidak ada sensor fisik';
            if (typeof info.todaySteps === 'number') setTodaySteps(info.todaySteps);
            if (typeof info.rejectedJolts === 'number') rejectedJolts = info.rejectedJolts;
            isTracking = Boolean(info.isTracking);

            if (!info.available || info.type === 'NONE') {
              setSensorStatus(STATUS.UNAVAILABLE, 'Sensor langkah tidak ditemukan', 'Perangkat Android ini tidak melaporkan TYPE_STEP_COUNTER, TYPE_STEP_DETECTOR, maupun TYPE_ACCELEROMETER.');
            } else if (info.permissionRequired && !info.permissionGranted && info.permissionRequestedBefore) {
              setSensorStatus(STATUS.DENIED, 'Izin Aktivitas Fisik ditolak', 'Ketuk Mulai Hitung untuk meminta ulang izin atau aktifkan di Pengaturan HP.');
            } else if (isTracking) {
              setSensorStatus(STATUS.ACTIVE);
            } else {
              setSensorStatus(STATUS.AVAILABLE);
            }
          } catch (e) {
            sensorTypeLabel = 'Native (Error Bridge)';
            setSensorStatus(STATUS.UNAVAILABLE, 'Gagal membaca sensor native', 'Pastikan WebView terhubung ke StepCounterService.');
          }
          return;
        }

        const hasGenericAccel = typeof window.LinearAccelerationSensor === 'function' || typeof window.Accelerometer === 'function';
        const hasDeviceMotion = typeof window.DeviceMotionEvent !== 'undefined';

        if (!hasGenericAccel && !hasDeviceMotion) {
          sensorTypeLabel = 'Tidak didukung browser';
          setSensorStatus(STATUS.UNAVAILABLE, 'API sensor gerak tidak tersedia', 'Buka di Chrome Android melalui HTTPS langsung atau install APK Android LangkahKu.');
          return;
        }

        sensorTypeLabel = hasGenericAccel ? 'Web (Accelerometer)' : 'Web (DeviceMotion)';
        setSensorStatus(STATUS.AVAILABLE);
      }

      window.onNativeStepUpdate = function (payloadStr) {
        try {
          const data = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
          if (typeof data.todaySteps === 'number') setTodaySteps(data.todaySteps);
          if (typeof data.rejectedJolts === 'number') rejectedJolts = data.rejectedJolts;
          if (typeof data.signalMag === 'number') {
            const barPct = Math.min(100, (data.signalMag / 4.0) * 100);
            document.getElementById('signalBar').style.width = barPct.toFixed(1) + '%';
            document.getElementById('signalReadout').textContent = data.signalMag.toFixed(2) + ' m/s²';
          }
          if (data.sensorType) {
            sensorTypeLabel = `Native (${data.sensorType})`;
            document.getElementById('sensorSourceLabel').textContent = `Sumber: ${sensorTypeLabel}`;
          }
          if (data.rhythmState === 'LOCKED') {
            isWalkingLocked = true;
            pendingRhythmSteps = 0;
          } else if (data.rhythmState === 'VERIFYING') {
            isWalkingLocked = false;
            pendingRhythmSteps = data.pendingSteps || 1;
          } else {
            isWalkingLocked = false;
            pendingRhythmSteps = 0;
          }
          updateRhythmBadge();
        } catch (e) {}
      };

      window.onNativeSensorStatus = function (payloadStr) {
        try {
          const data = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
          if (data.sensorType) sensorTypeLabel = `Native (${data.sensorType})`;
          isTracking = data.status === STATUS.ACTIVE;
          setSensorStatus(data.status || STATUS.UNAVAILABLE, data.title, data.message);
        } catch (e) {}
      };

      function processLinearMagnitude(rawMag, now) {
        magWindow.push(rawMag);
        if (magWindow.length > 4) magWindow.shift();
        const smoothMag = magWindow.reduce((a, b) => a + b, 0) / magWindow.length;

        const cfg = SENSITIVITY[state.sensitivity];
        const barPct = Math.min(100, (smoothMag / 4.0) * 100);
        document.getElementById('signalBar').style.width = barPct.toFixed(1) + '%';
        document.getElementById('signalReadout').textContent = smoothMag.toFixed(2) + ' m/s²';

        if (!isPeakArmed && smoothMag >= cfg.peak) {
          isPeakArmed = true;
        } else if (isPeakArmed && smoothMag <= cfg.valley) {
          isPeakArmed = false;
          evaluateStepCandidate(now);
        }
      }

      function evaluateStepCandidate(now) {
        const dt = lastCandidateTime === 0 ? 0 : (now - lastCandidateTime);

        if (lastCandidateTime !== 0 && dt < MIN_STEP_INTERVAL_MS) {
          rejectedJolts += 1;
          updateRhythmBadge();
          return;
        }

        if (lastCandidateTime === 0 || dt > MAX_STEP_INTERVAL_MS) {
          if (pendingRhythmSteps > 0 && !isWalkingLocked) {
            rejectedJolts += pendingRhythmSteps;
          }
          isWalkingLocked = false;
          pendingRhythmSteps = 1;
          lastCandidateTime = now;
          updateRhythmBadge();
          return;
        }

        lastCandidateTime = now;
        if (isWalkingLocked) {
          addSteps(1);
        } else {
          pendingRhythmSteps += 1;
          if (pendingRhythmSteps >= CONFIRM_STEPS_NEEDED) {
            isWalkingLocked = true;
            addSteps(pendingRhythmSteps);
            pendingRhythmSteps = 0;
          }
        }
        updateRhythmBadge();
      }

      function onDeviceMotion(event) {
        let lx = 0, ly = 0, lz = 0;
        const lin = event.acceleration;
        const withG = event.accelerationIncludingGravity;

        if (lin && (lin.x !== null || lin.y !== null || lin.z !== null)) {
          if (Math.abs(lin.x || 0) + Math.abs(lin.y || 0) + Math.abs(lin.z || 0) > 0.0001) {
            hardwareSignalSeen = true;
          }
          lx = lin.x || 0; ly = lin.y || 0; lz = lin.z || 0;
        } else if (withG && (withG.x !== null || withG.y !== null || withG.z !== null)) {
          hardwareSignalSeen = true;
          const ax = withG.x || 0, ay = withG.y || 0, az = withG.z || 0;
          if (!gravity.initialized) {
            gravity = { x: ax, y: ay, z: az, initialized: true };
          } else {
            const alpha = 0.85;
            gravity.x = alpha * gravity.x + (1 - alpha) * ax;
            gravity.y = alpha * gravity.y + (1 - alpha) * ay;
            gravity.z = alpha * gravity.z + (1 - alpha) * az;
          }
          lx = ax - gravity.x; ly = ay - gravity.y; lz = az - gravity.z;
        } else {
          return;
        }

        processLinearMagnitude(Math.sqrt(lx * lx + ly * ly + lz * lz), Date.now());
      }

      function startWebSensor() {
        if (typeof window.DeviceMotionEvent !== 'undefined' && typeof window.DeviceMotionEvent.requestPermission === 'function') {
          window.DeviceMotionEvent.requestPermission()
            .then(res => {
              if (res === 'granted') attachWebListeners();
              else setSensorStatus(STATUS.DENIED, 'Izin sensor gerak ditolak', 'Izinkan akses Motion & Orientation pada pengaturan browser.');
            })
            .catch(() => {
              setSensorStatus(STATUS.UNAVAILABLE, 'Sensor gagal diinisialisasi', 'Browser membatasi akses DeviceMotionEvent pada halaman ini.');
            });
          return;
        }
        attachWebListeners();
      }

      function attachWebListeners() {
        hardwareSignalSeen = false;
        gravity.initialized = false;
        magWindow = [];
        isPeakArmed = false;
        pendingRhythmSteps = 0;
        isWalkingLocked = false;
        lastCandidateTime = 0;

        let startedGeneric = false;
        if (typeof window.LinearAccelerationSensor === 'function') {
          try {
            genericAccelSensor = new window.LinearAccelerationSensor({ frequency: 50 });
            genericAccelSensor.addEventListener('reading', () => {
              hardwareSignalSeen = true;
              const mag = Math.sqrt(
                (genericAccelSensor.x || 0) ** 2 +
                (genericAccelSensor.y || 0) ** 2 +
                (genericAccelSensor.z || 0) ** 2
              );
              processLinearMagnitude(mag, Date.now());
            });
            genericAccelSensor.addEventListener('error', ev => {
              const name = ev && ev.error ? ev.error.name : '';
              stopWebSensor(false);
              if (name === 'NotAllowedError' || name === 'SecurityError') {
                attachDeviceMotionFallback();
              } else {
                attachDeviceMotionFallback();
              }
            });
            genericAccelSensor.start();
            startedGeneric = true;
            sensorTypeLabel = 'Web (LinearAcceleration)';
          } catch (e) {
            startedGeneric = false;
          }
        }

        if (!startedGeneric) {
          attachDeviceMotionFallback();
          return;
        }
        finalizeWebStart();
      }

      function attachDeviceMotionFallback() {
        if (typeof window.DeviceMotionEvent === 'undefined') {
          setSensorStatus(STATUS.UNAVAILABLE, 'Sensor tidak tersedia', 'Browser ini tidak mendukung DeviceMotionEvent.');
          return;
        }
        sensorTypeLabel = 'Web (DeviceMotion)';
        window.addEventListener('devicemotion', onDeviceMotion);
        finalizeWebStart();
      }

      function finalizeWebStart() {
        isTracking = true;
        setSensorStatus(STATUS.ACTIVE);

        clearTimeout(sensorWatchdog);
        sensorWatchdog = setTimeout(() => {
          if (isTracking && !hardwareSignalSeen) {
            stopWebSensor(false);
            let reason = 'Perangkat ini tidak mengirim sinyal akselerometer (misalnya dibuka di laptop/PC).';
            if (isEmbeddedIframe()) {
              reason = 'Halaman ini dimuat di dalam embed/iframe (seperti Google Sites) yang memblokir sensor gerak HP. Buka file index.html langsung di GitHub Pages / Netlify Drop (HTTPS) atau install APK Android LangkahKu.';
            } else if (isInsecureOrigin()) {
              reason = `Browser memblokir sensor gerak pada protokol "${window.location.protocol}". Buka lewat tautan HTTPS langsung atau install APK Android LangkahKu.`;
            }
            setSensorStatus(STATUS.UNAVAILABLE, 'Sensor fisik tidak merespons', reason);
          }
        }, 3500);

        clearInterval(idleCheckInterval);
        idleCheckInterval = setInterval(() => {
          if (!isTracking) return;
          const now = Date.now();
          if (lastCandidateTime > 0 && (now - lastCandidateTime) > RHYTHM_RESET_MS) {
            if (pendingRhythmSteps > 0 && !isWalkingLocked) {
              rejectedJolts += pendingRhythmSteps;
            }
            pendingRhythmSteps = 0;
            isWalkingLocked = false;
            lastCandidateTime = 0;
            updateRhythmBadge();
          }
        }, 400);
      }

      function stopWebSensor(markAvailable) {
        window.removeEventListener('devicemotion', onDeviceMotion);
        if (genericAccelSensor) {
          try { genericAccelSensor.stop(); } catch (e) {}
          genericAccelSensor = null;
        }
        clearTimeout(sensorWatchdog);
        clearInterval(idleCheckInterval);
        isTracking = false;
        isWalkingLocked = false;
        pendingRhythmSteps = 0;
        document.getElementById('signalBar').style.width = '0%';
        document.getElementById('signalReadout').textContent = '0.00 m/s²';
        if (markAvailable) setSensorStatus(STATUS.AVAILABLE);
      }

      function startTracking() {
        if (hasNativeBridge) {
          try { window.AndroidStepBridge.requestPermissionAndStart(state.sensitivity); }
          catch (e) { setSensorStatus(STATUS.UNAVAILABLE, 'Gagal memulai sensor native', 'Terjadi kesalahan pada AndroidStepBridge.'); }
          return;
        }
        startWebSensor();
      }

      function pauseTracking() {
        if (hasNativeBridge) {
          try {
            window.AndroidStepBridge.pauseTracking();
            isTracking = false;
            setSensorStatus(STATUS.AVAILABLE);
          } catch (e) { showToast('Gagal menjeda sensor native.'); }
          return;
        }
        stopWebSensor(true);
      }

      function updateTrackingButtonUI() {
        const btn = document.getElementById('toggleTrackingBtn');
        const lbl = document.getElementById('toggleTrackingLabel');
        const ico = document.getElementById('toggleTrackingIcon');
        if (isTracking) {
          lbl.textContent = 'Jeda';
          ico.innerHTML = PAUSE_SVG;
          btn.className = 'btn-primary paused-mode';
        } else {
          lbl.textContent = 'Mulai Hitung';
          ico.innerHTML = PLAY_SVG;
          btn.className = 'btn-primary';
        }
      }

      function updateRhythmBadge() {
        const badge = document.getElementById('rhythmLockBadge');
        document.getElementById('rejectedCountText').textContent = `Guncangan diabaikan: ${rejectedJolts}`;

        if (sensorStatus === STATUS.UNAVAILABLE) {
          badge.textContent = 'Gagal inisialisasi';
          badge.className = 'rhythm-badge verifying';
        } else if (sensorStatus === STATUS.DENIED) {
          badge.textContent = 'Perlu izin';
          badge.className = 'rhythm-badge error';
        } else if (!isTracking) {
          badge.textContent = 'Dijeda';
          badge.className = 'rhythm-badge';
        } else if (isWalkingLocked) {
          badge.textContent = 'Ritme Terkunci';
          badge.className = 'rhythm-badge locked';
        } else if (pendingRhythmSteps > 0) {
          badge.textContent = `Verifikasi (${pendingRhythmSteps}/${CONFIRM_STEPS_NEEDED})`;
          badge.className = 'rhythm-badge verifying';
        } else {
          badge.textContent = 'Memantau langkah';
          badge.className = 'rhythm-badge locked';
        }
      }

      function renderSensitivityUI() {
        const cfg = SENSITIVITY[state.sensitivity];
        document.getElementById('sensThresholdText').textContent = cfg.label;
        const markerPct = Math.min(95, (cfg.peak / 4.0) * 100);
        document.getElementById('thresholdMarker').style.left = markerPct.toFixed(1) + '%';
        document.querySelectorAll('.sens-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.sens === state.sensitivity);
        });
      }

      function renderHistory() {
        const listEl = document.getElementById('historyList');
        const days = [];
        const now = new Date();
        let weeklyTotal = 0;

        for (let i = 0; i < 7; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const count = state.history[key] || 0;
          weeklyTotal += count;
          let label = '';
          if (i === 0) label = 'Hari ini';
          else if (i === 1) label = 'Kemarin';
          else {
            try { label = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); }
            catch (e) { label = key; }
          }
          days.push({ label, count, isToday: i === 0 });
        }

        document.getElementById('weeklyTotalText').textContent = `Total: ${formatInt(weeklyTotal)}`;
        const goal = Math.max(1, state.dailyGoal);

        listEl.innerHTML = days.map(item => {
          const pct = Math.min(100, Math.round((item.count / goal) * 100));
          return `
            <div>
              <div class="hist-item-top">
                <span class="hist-day${item.isToday ? ' today' : ''}">${item.label}</span>
                <span class="hist-val${item.isToday ? ' today' : ''}">${formatInt(item.count)} <span>langkah</span></span>
              </div>
              <div class="hist-track">
                <div class="hist-bar${item.isToday ? ' today' : ''}" style="width:${pct}%"></div>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderUI() {
        const steps = getTodaySteps();
        const goal = Math.max(1, state.dailyGoal);
        const pct = Math.min(100, Math.round((steps / goal) * 100));
        const offset = RING_CIRCUMFERENCE - (pct / 100) * RING_CIRCUMFERENCE;

        document.getElementById('stepCountText').textContent = formatInt(steps);
        document.getElementById('goalCountText').textContent = formatInt(goal);
        document.getElementById('goalPercentText').textContent = `${pct}%`;
        document.getElementById('progressCircle').style.strokeDashoffset = offset;

        renderSensitivityUI();
        renderHistory();
      }

      function bindEvents() {
        document.getElementById('toggleTrackingBtn').addEventListener('click', () => {
          isTracking ? pauseTracking() : startTracking();
        });

        document.getElementById('resetTodayBtn').addEventListener('click', () => {
          rejectedJolts = 0;
          pendingRhythmSteps = 0;
          isWalkingLocked = false;
          setTodaySteps(0);
          if (hasNativeBridge) {
            try { window.AndroidStepBridge.resetToday(); } catch (e) {}
          }
          updateRhythmBadge();
          showToast('Hitungan langkah hari ini direset ke 0.');
        });

        document.querySelectorAll('.sens-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.sensitivity = btn.dataset.sens;
            saveState();
            renderSensitivityUI();
            if (hasNativeBridge) {
              try { window.AndroidStepBridge.setSensitivity(state.sensitivity); } catch (e) {}
            }
            showToast('Kalibrasi sensitivitas diperbarui.');
          });
        });

        const modal = document.getElementById('goalModal');
        const openModal = () => {
          document.getElementById('goalInput').value = state.dailyGoal;
          modal.classList.remove('hidden');
        };
        const closeModal = () => modal.classList.add('hidden');

        document.getElementById('editGoalBtn').addEventListener('click', openModal);
        document.getElementById('closeGoalModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelGoalBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

        document.getElementById('goalForm').addEventListener('submit', e => {
          e.preventDefault();
          const val = parseInt(document.getElementById('goalInput').value, 10);
          state.dailyGoal = Math.max(500, isNaN(val) ? 8000 : val);
          saveState();
          renderUI();
          closeModal();
          showToast(`Target harian diatur ke ${formatInt(state.dailyGoal)} langkah.`);
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('todayDateLabel').textContent = formatDateHeading();
        bindEvents();
        renderUI();
        initSensorEnvironment();
      });
    })();
  </script>
</body>
</html>
