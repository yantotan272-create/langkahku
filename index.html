<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LangkahKu — Penghitung Langkah Harian Presisi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --subtle: #94a3b8;
      --orange: #ea580c;
      --orange-dark: #c2410c;
      --orange-soft: #fff7ed;
      --green: #059669;
      --green-soft: #ecfdf5;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --rose: #be123c;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input { font-family: inherit; }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--orange);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-title { font-size: 15px; font-weight: 800; line-height: 1.2; color: var(--text); }
    .brand-date { font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }

    .target-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      background: #f1f5f9;
      transition: background 0.15s;
    }
    .target-btn:hover { background: #e2e8f0; }

    /* Main Layout */
    .main {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* Status Row */
    .status-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill-active { background: var(--green-soft); color: var(--green); }
    .pill-active .pill-dot { background: #10b981; animation: pulse 1.4s ease-in-out infinite; }
    .pill-available { background: var(--blue-soft); color: var(--blue); }
    .pill-available .pill-dot { background: #3b82f6; }
    .pill-unavailable { background: var(--amber-soft); color: var(--amber); }
    .pill-unavailable .pill-dot { background: #f59e0b; }
    .pill-denied { background: var(--rose-soft); color: var(--rose); }
    .pill-denied .pill-dot { background: #f43f5e; }
    .pill-neutral { background: #f1f5f9; color: #475569; }
    .pill-neutral .pill-dot { background: #94a3b8; }

    .rhythm-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      white-space: nowrap;
    }
    .rhythm-badge.locked { background: var(--green-soft); color: var(--green); border-color: #a7f3d0; }
    .rhythm-badge.verifying { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
    .rhythm-badge.error { background: var(--rose-soft); color: var(--rose); border-color: var(--rose-border); }

    /* Circular Ring */
    .ring-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 14px;
      width: 224px;
      height: 224px;
    }
    .ring-svg { width: 100%; height: 100%; }
    .ring-progress {
      transition: stroke-dashoffset 0.3s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .step-number {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text);
    }
    .step-goal { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 6px; }
    .step-goal strong { color: #334155; }
    .step-pct {
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--orange-soft);
      color: var(--orange-dark);
    }

    /* Controls */
    .controls-row {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-primary {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      background: var(--orange);
      color: #fff;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--orange-dark); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary.paused-mode {
      background: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }
    .btn-primary.paused-mode:hover { background: #1e293b; }

    .btn-reset {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: #e2e8f0; }

    /* Signal Diagnostics */
    .signal-box {
      width: 100%;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .signal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .signal-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #334155; flex-shrink: 0; }
    .signal-track {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .signal-fill {
      height: 100%;
      background: #f97316;
      border-radius: 999px;
      width: 0%;
      transition: width 0.08s linear;
    }
    .signal-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #0f172a;
      left: 31%;
    }
    .signal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--subtle);
    }
    .signal-foot span:last-child { flex-shrink: 0; }

    /* Diagnostic Banner */
    .diag-box {
      width: 100%;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--amber-border);
      background: var(--amber-soft);
      color: #78350f;
      font-size: 12px;
      line-height: 1.5;
    }
    .diag-box.error {
      border-color: var(--rose-border);
      background: var(--rose-soft);
      color: #881337;
    }
    .diag-title { font-weight: 700; margin-bottom: 4px; }
    .hidden { display: none !important; }

    /* Sensitivity Card */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .section-mono { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .sens-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
    }
    .sens-btn {
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      transition: all 0.15s;
    }
    .sens-btn.active {
      background: #0f172a;
      color: #fff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
    }

    /* History Card */
    .history-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .history-total { font-size: 12px; font-weight: 600; color: var(--muted); }
    .history-list { display: flex; flex-direction: column; gap: 11px; margin-top: 12px; }
    .hist-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .hist-day { font-weight: 500; color: #475569; }
    .hist-day.today { font-weight: 700; color: var(--text); }
    .hist-val { font-weight: 600; color: #334155; }
    .hist-val.today { font-weight: 700; color: var(--orange-dark); }
    .hist-val span { font-weight: 400; color: var(--subtle); }
    .hist-track { width: 100%; height: 7px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .hist-bar { height: 100%; background: #94a3b8; border-radius: 999px; transition: width 0.3s ease; }
    .hist-bar.today { background: var(--orange); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 340px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .modal-close { padding: 4px; color: var(--subtle); border-radius: 8px; }
    .modal-close:hover { color: var(--text); background: #f1f5f9; }
